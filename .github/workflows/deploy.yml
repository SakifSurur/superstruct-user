name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC token for assuming the AWS deploy role
  contents: read

# CloudFormation updates must not interleave.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  DEPLOY_ROLE_ARN: arn:aws:iam::076899628449:role/superstruct-user-github-actions-deploy

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sfL -o /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.0.1/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt

      # A fresh account first needs the bootstrap order from the README and
      # one run with --backend-bootstrap.
      - name: Apply infrastructure (Terragrunt)
        working-directory: infrastructure/dev
        env:
          TG_NON_INTERACTIVE: 'true'
        run: terragrunt run --all apply

      - name: Deploy JWKS API
        run: npm run deploy:jwks

      - name: Deploy API
        run: npm run deploy:api
