name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC token for assuming the AWS deploy role
  contents: read

# Deploys must not interleave — CloudFormation updates are stateful.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  DEPLOY_ROLE_ARN: arn:aws:iam::076899628449:role/superstruct-user-github-actions-deploy

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sfL -o /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.0.1/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt

      # All Terragrunt-managed infrastructure: KMS, Security Hub, OIDC,
      # Amplify hosting, CloudFront + WAF edge. Steady-state ordering is safe;
      # a fresh account needs 40-frontend-hosting and the API stack before
      # 30-edge (see README).
      # The state bucket already exists; a fresh account bootstraps it once
      # with: terragrunt run --all --backend-bootstrap apply
      - name: Apply infrastructure (Terragrunt)
        working-directory: infrastructure/dev
        env:
          TG_NON_INTERACTIVE: 'true'
        run: terragrunt run --all apply

      - name: Deploy API
        run: npm run deploy:api

      - name: Build and publish SPA to Amplify
        run: ./services/frontend/deploy.sh dev
