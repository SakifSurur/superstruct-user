service: superstruct-user-frontend
frameworkVersion: '^4.0.0'

# Resources-only stack: the Amplify Hosting app and its branch. The repo has no
# git remote, so builds are pushed with Amplify's manual-deployment API — see
# deploy.sh, which deploys this stack, builds the SPA, and uploads dist/.

provider:
  name: aws
  region: eu-central-1
  stage: ${opt:stage, 'dev'}
  tags:
    Project: superstruct-user
    Environment: ${self:provider.stage}
    ManagedBy: oss-serverless

resources:
  Resources:
    FrontendApp:
      Type: AWS::Amplify::App
      Properties:
        Name: superstruct-user-${self:provider.stage}
        Description: SPA consuming the user API through CloudFront.
        Platform: WEB
        CustomRules:
          # SPA fallback: anything that isn't a static asset serves index.html.
          - Source: '</^[^.]+$|\.(?!(css|js|map|json|png|svg|jpg|ico|txt|woff2?)$)([^.]+$)/>'
            Target: /index.html
            Status: '200'

    MainBranch:
      Type: AWS::Amplify::Branch
      Properties:
        AppId: !GetAtt FrontendApp.AppId
        BranchName: main
        EnableAutoBuild: false
        Stage: PRODUCTION

  Outputs:
    AppId:
      Value: !GetAtt FrontendApp.AppId
    AppUrl:
      Description: Public URL of the frontend; also the allowed CORS origin on the API.
      Value: !Sub 'https://main.${FrontendApp.DefaultDomain}'
